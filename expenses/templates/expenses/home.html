{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{% static 'expenses/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <a href="{% url 'add-expense' %}" class="add-button">
            + Add Expense
        </a>

        <h2>Your Expenses</h2>

        {% for expense in expenses %}

            <div class="expense-card">

                <p><strong>{{ expense.category }}</strong></p>

                <p>Amount: ₹{{ expense.amount }}</p>

                <p>{{ expense.description }}</p>

                <p>Date: {{ expense.date }}</p>

                <div class="actions">

                    <a href="{% url 'edit-expense' expense.id %}"
                       class="edit-button">
                        Edit
                    </a>

                    <a href="{% url 'delete-expense' expense.id %}"
                       class="delete-button">
                        Delete
                    </a>

                </div>

            </div>

        {% empty %}

            <p>No expenses added yet.</p>

        {% endfor %}

    </div>

</body>
</html>
